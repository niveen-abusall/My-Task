<h2>📝My To-Do List</h2>


<div class="To-Do"

<br>

  <input type="text" id="taskInput" placeholder="Enter task name">
  <button onclick="addTask()">Add Task</button>

  <table>
    <thead>
      <tr>
        <th>Task Name</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="taskTableBody">
      <tr onclick="toggleStatus(this)">
        <td>Buy groceries</td>
        <td class="status incomplete">Incomplete</td>
      </tr>
      <tr onclick="toggleStatus(this)">
        <td>Finish the report</td>
        <td class="status incomplete">Incomplete</td>
      </tr>
      <tr onclick="toggleStatus(this)">
        <td>Call the dentist</td>
        <td class="status incomplete">Incomplete</td>
      </tr>
    </tbody>
  </table>

  </div>
